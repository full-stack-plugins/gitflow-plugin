name: GitFlow policy check
description: Validate PR commits and merge direction against the trusted base policy
inputs:
  repository:
    description: Checked-out repository path with complete base and head objects
    default: '.'
  message-mode:
    description: commits or squash (PR title plus body as the explicit candidate)
    default: commits
outputs:
  decision:
    description: allow, deny or unverified
    value: ${{ steps.check.outputs.decision }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - id: check
      shell: bash
      env:
        GITFLOW_ACTION_PATH: ${{ github.action_path }}
        GITFLOW_REPOSITORY: ${{ inputs.repository }}
        GITFLOW_MESSAGE_MODE: ${{ inputs.message-mode }}
      run: >-
        python3 "$GITFLOW_ACTION_PATH/scripts/ci_check.py"
        --repo "$GITFLOW_REPOSITORY" --event "$GITHUB_EVENT_PATH"
        --message-mode "$GITFLOW_MESSAGE_MODE"
        --output "$RUNNER_TEMP/gitflow-check.json" --summary "$GITHUB_STEP_SUMMARY"
